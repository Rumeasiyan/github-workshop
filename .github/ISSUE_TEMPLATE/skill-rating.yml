name: Skill rating
description: Rate yourself at the start and the end of the day (1 = never done it, 5 = could teach it).
title: "Skill rating: start, <your name>"
labels: ["skill-rating"]
body:
  - type: dropdown
    id: when
    attributes:
      label: When
      options: ["Start of the day", "End of the day"]
    validations: { required: true }
  - type: dropdown
    id: git-basics
    attributes:
      label: "Git basics (commit, sync, history)"
      options: ["1", "2", "3", "4", "5"]
    validations: { required: true }
  - type: dropdown
    id: branches-prs
    attributes:
      label: "Branches and pull requests"
      options: ["1", "2", "3", "4", "5"]
    validations: { required: true }
  - type: dropdown
    id: reviews
    attributes:
      label: "Reviewing someone's work"
      options: ["1", "2", "3", "4", "5"]
    validations: { required: true }
  - type: dropdown
    id: conflicts
    attributes:
      label: "Resolving conflicts"
      options: ["1", "2", "3", "4", "5"]
    validations: { required: true }
  - type: dropdown
    id: undo
    attributes:
      label: "Undoing and recovering"
      options: ["1", "2", "3", "4", "5"]
    validations: { required: true }
  - type: dropdown
    id: automation
    attributes:
      label: "GitHub automation (checks, rulesets, releases)"
      options: ["1", "2", "3", "4", "5"]
    validations: { required: true }
  - type: textarea
    id: note
    attributes:
      label: "One line: what you want from today (start) or what changed (end)"
